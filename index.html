        const { useState, useEffect, useMemo, useRef } = React;

        const shuffleArray = (array) => {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        };

        const normalizeText = (text) => text.toString().toLowerCase().replace(/\s+/g, '').trim();

        const arraysEqual = (a, b) => {
            if (a === b) return true;
            if (a == null || b == null) return false;
            if (a.length !== b.length) return false;
            const sortedA = [...a].sort();
            const sortedB = [...b].sort();
            for (let i = 0; i < sortedA.length; ++i) {
                if (sortedA[i] !== sortedB[i]) return false;
            }
            return true;
        };

                }
                return () => chartInstance.current?.destroy();

            return <div className={`relative w-full ${height}`}><canvas ref={canvasRef}></canvas></div>;

                    <Card className="border-l-4 border-blue-600">

                        </Button>
                    </Card>

        const ExamEngine = ({ user, settings, questions, session, onFinish }) => {
            const preparedQuestions = useMemo(() => {
                let qs = [...questions];
                if (settings.randomizeQuestions) {
                    qs = shuffleArray(qs);
                }
                return qs;
            }, [questions, settings.randomizeQuestions]);

            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(settings.duration * 60);
            const [showConfirm, setShowConfirm] = useState(false);

            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleFinishExam();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const currentQ = preparedQuestions[currentIndex];

            const handleSingleChoice = (val) => {
                setAnswers(prev => ({ ...prev, [currentQ.id]: val }));
            };

            const handleMultipleChoice = (key) => {
                const currentAns = answers[currentQ.id] || [];
                let nextAns;
                if (currentAns.includes(key)) {
                    nextAns = currentAns.filter(k => k !== key);
                } else {
                    nextAns = [...currentAns, key];
                }
                setAnswers(prev => ({ ...prev, [currentQ.id]: nextAns }));
            };

            const handleTextChoice = (val) => {
                setAnswers(prev => ({ ...prev, [currentQ.id]: val }));
            };

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const handleFinishExam = () => {
                let totalMaxWeight = 0;
                let earnedWeight = 0;
                let correctCount = 0;
                let wrongCount = 0;
                let emptyCount = 0;

                questions.forEach(q => {
                    totalMaxWeight += q.weight;
                    const userAns = answers[q.id];

                    if (userAns === undefined || userAns === '' || (Array.isArray(userAns) && userAns.length === 0)) {
                        emptyCount++;
                    } else {
                        if (q.type === 'PG' || q.type === 'BS') {
                            if (userAns === q.answer) {
                                earnedWeight += q.weight;
                                correctCount++;
                            } else {
                                wrongCount++;
                            }
                        } else if (q.type === 'PGK') {
                            if (arraysEqual(userAns, q.answer)) {
                                earnedWeight += q.weight;
                                correctCount++;
                            } else {
                                wrongCount++;
                            }
                        } else if (q.type === 'IS') {
                            const normAns = normalizeText(userAns);
                            const matched = q.altAnswers.some(alt => normalizeText(alt) === normAns);
                            if (matched) {
                                earnedWeight += q.weight;
                                correctCount++;
                            } else {
                                wrongCount++;
                            }
                        }
                    }
                });

                const finalScore = Math.round((earnedWeight / totalMaxWeight) * 100);

                const resultObject = {
                    id: Math.random().toString(36).substr(2, 9),
                    user,
                    score: finalScore,
                    passed: finalScore >= settings.kktp,
                    kktp: settings.kktp,
                    stats: { correct: correctCount, wrong: wrongCount, empty: emptyCount },
                    date: new Date().toLocaleDateString('id-ID'),
                    userAnswers: answers
                };

                onFinish(resultObject);
            };

            return (
                <div className="p-4 md:p-6 max-w-6xl mx-auto">
                    {/* Header bar */}
                    <div className="bg-white rounded-xl shadow-md p-4 mb-6 flex flex-wrap justify-between items-center gap-4 border-t-4 border-blue-600 no-print">
                        <div>
                            <span className="text-xs text-gray-500 block">Peserta Ujian</span>
                            <span className="font-bold text-gray-800">{user.name} ({user.class})</span>
                        </div>
                        <div className="flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 px-4 py-2 rounded-lg font-bold text-lg">
                            <i className="ph-bold ph-timer text-2xl"></i> {formatTime(timeLeft)}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                        {/* Question Content */}
                        <div className="lg:col-span-3 space-y-6">
                            <Card className="min-h-[400px]">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <span className="font-bold text-blue-800 text-lg">Soal Nomor {currentIndex + 1} dari {preparedQuestions.length}</span>
                                    <span className="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-bold uppercase">{currentQ.type}</span>
                                </div>

                                {currentQ.stimulus && (
                                    <div className="mb-4 p-3 bg-slate-50 border-l-4 border-blue-500 rounded text-sm text-gray-700 font-medium whitespace-pre-line">
                                        {currentQ.stimulus}
                                    </div>
                                )}

                                <div className="text-base text-gray-800 font-semibold mb-6">
                                    {currentQ.text}
                                </div>

                                {/* Options */}
                                <div className="space-y-3">
                                    {currentQ.type === 'PG' && Object.entries(currentQ.options).map(([key, val]) => (
                                        <label key={key} className={`flex items-center gap-3 p-3.5 rounded-lg border-2 cursor-pointer transition ${answers[currentQ.id] === key ? 'border-blue-600 bg-blue-50 text-blue-900 font-medium' : 'border-gray-200 hover:bg-gray-50'}`}>
                                            <input type="radio" name={`q-${currentQ.id}`} checked={answers[currentQ.id] === key} onChange={() => handleSingleChoice(key)} className="w-5 h-5 text-blue-600" />

                                        </label>
                                    ))}

                                    {currentQ.type === 'PGK' && Object.entries(currentQ.options).map(([key, val]) => {
                                        const isChecked = (answers[currentQ.id] || []).includes(key);
                                        return (
                                            <label key={key} className={`flex items-center gap-3 p-3.5 rounded-lg border-2 cursor-pointer transition ${isChecked ? 'border-blue-600 bg-blue-50 text-blue-900 font-medium' : 'border-gray-200 hover:bg-gray-50'}`}>
                                                <input type="checkbox" checked={isChecked} onChange={() => handleMultipleChoice(key)} className="w-5 h-5 text-blue-600 rounded" />
                                                <span><strong className="mr-2">{key}.</strong>{val}</span>
                                            </label>
                                        );
                                    })}

                                    {currentQ.type === 'BS' && (
                                        <div className="grid grid-cols-2 gap-4">

                                                <button key={opt} type="button" onClick={() => handleSingleChoice(opt)} className={`py-4 rounded-xl border-2 font-bold transition text-lg ${answers[currentQ.id] === opt ? (opt === 'BENAR' ? 'bg-emerald-50 border-emerald-600 text-emerald-700' : 'bg-red-50 border-red-600 text-red-700') : 'border-gray-200 hover:bg-gray-50 text-gray-700'}`}>
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {currentQ.type === 'IS' && (
                                        <div className="pt-2">
                                            <input type="text" value={answers[currentQ.id] || ''} onChange={e => handleTextChoice(e.target.value)} placeholder="Tuliskan jawaban singkat Anda di sini..." className="w-full p-4 border-2 rounded-xl focus:border-blue-600 focus:outline-none font-medium text-lg" />
                                        </div>
                                    )}

                                    </Button>

                                            Selesai & Selesai <i className="ph-bold ph-check-circle"></i>
                                        </Button>
                                    ) : (
                                        <Button onClick={() => setCurrentIndex(prev => Math.min(preparedQuestions.length - 1, prev + 1))} variant="primary">
                                            Berikutnya <i className="ph-bold ph-arrow-right"></i>
                                        </Button>
                                    )}
                                </div>
                            </Card>
                        </div>

                        {/* Question Grid Sidebar */}
                        <div className="space-y-4">
                            <Card>
                                <h4 className="font-bold text-gray-800 mb-3 flex items-center justify-between">
                                    <span>Navigasi Soal</span>
                                    <span className="text-xs bg-gray-100 px-2 py-1 rounded text-gray-600">{Object.keys(answers).length}/{preparedQuestions.length} Terjawab</span>
                                </h4>
                                <div className="grid grid-cols-5 gap-2">
                                    {preparedQuestions.map((q, idx) => {
                                        const isAnswered = answers[q.id] !== undefined && answers[q.id] !== '' && (!Array.isArray(answers[q.id]) || answers[q.id].length > 0);
                                        const isCurrent = idx === currentIndex;
                                        return (
                                            <button key={q.id} onClick={() => setCurrentIndex(idx)} className={`w-full h-10 rounded-lg text-xs font-bold flex items-center justify-center transition border ${isCurrent ? 'ring-2 ring-blue-600 ring-offset-2' : ''} ${isAnswered ? 'bg-blue-600 text-white border-blue-600' : 'bg-gray-100 text-gray-700 hover:bg-gray-200 border-gray-300'}`}>
                                                {idx + 1}
                                            </button>
                                        );
                                    })}
                                </div>
                                <div className="mt-6">
                                    <Button onClick={() => setShowConfirm(true)} variant="danger" className="w-full">
                                        Kirim Hasil Ujian
                                    </Button>
                                </div>
                            </Card>
                        </div>
                    </div>

                    {/* Confirmation Modal */}
                    {showConfirm && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 text-center space-y-4 shadow-2xl">
                                <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-3xl">
                                    <i className="ph-bold ph-warning"></i>
                                </div>
                                <h3 className="text-xl font-bold text-gray-800">Konfirmasi Selesai Ujian</h3>
                                <p className="text-sm text-gray-600">Apakah Anda yakin ingin menyelesaikan ujian ini? Pastikan seluruh soal telah Anda periksa dengan teliti.</p>
                                <div className="flex gap-3 pt-2">
                                    <Button onClick={() => setShowConfirm(false)} variant="secondary" className="flex-1">Batal</Button>
                                    <Button onClick={handleFinishExam} variant="success" className="flex-1">Ya, Selesai</Button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const StudentResult = ({ result, settings, onLogout, onPrint }) => {
            return (
                <div className="p-6 max-w-3xl mx-auto space-y-6">
                    <Card className="text-center p-8 space-y-4 border-t-8 border-blue-700">
                        <div className="w-20 h-24 mx-auto mb-2">

            return (
                <div className="bg-white min-h-screen">
                    <div className="no-print p-4 bg-gray-800 text-white flex justify-between items-center fixed top-0 w-full z-50">
                        <div className="font-bold flex items-center gap-2"><i className="ph-bold ph-printer"></i> Mode Cetak Dokumen</div>
                        <div className="flex gap-2">
                            <Button variant="success" onClick={() => window.print()}><i className="ph-bold ph-printer"></i> Cetak Sekarang</Button>
                            <Button variant="secondary" onClick={onClose}><i className="ph-bold ph-x"></i> Tutup</Button>
                        </div>
                    </div>
                    <div className="p-8 pt-24 print:p-0 print:pt-0 max-w-4xl mx-auto text-black print:text-black">
                        {content}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [db, setDb] = useState({
                settings: {
                    name: "Penilaian Sumatif Semester Satu KKA",
                    school: "SMP Negeri 1 Jepara",
                    class: "Kelas 7",
                    duration: 90,
                    kktp: 75,
                    randomizeQuestions: true,
                    randomizeOptions: true,
                    status: "Aktif",
                    pgkFullCredit: true
                },
                questions: rawQuestions,
                results: mockResults
            });

            const [currentView, setCurrentView] = useState('studentLogin');
            const [currentUser, setCurrentUser] = useState(null);
            const [currentExamSession, setCurrentExamSession] = useState(null);

            const [printMode, setPrintMode] = useState(null);
            const [printData, setPrintData] = useState(null);

            useEffect(() => {
                if (printMode) {
                    setTimeout(() => { window.print(); }, 500);
                }
            }, [printMode]);

            const closePrint = () => {
                setPrintMode(null);
                setPrintData(null);
            };

            const renderView = () => {
                if (printMode) {
                    return <PrintLayout mode={printMode} data={printData} db={db} onClose={closePrint} />;
                }

                switch (currentView) {
                    case 'studentLogin':
                        return <StudentLogin onLogin={(user) => { setCurrentUser(user); setCurrentView('studentDash'); }} onAdminClick={() => setCurrentView('adminLogin')} />;
                    case 'studentDash':
                        return <StudentDashboard user={currentUser} settings={db.settings} onStart={(session) => { setCurrentExamSession(session); setCurrentView('exam'); }} onLogout={() => { setCurrentUser(null); setCurrentView('studentLogin'); }} />;
                    case 'exam':
                        return <ExamEngine user={currentUser} settings={db.settings} questions={db.questions} session={currentExamSession} onFinish={(res) => { setDb(prev => ({ ...prev, results: [...prev.results, res] })); setCurrentExamSession(res); setCurrentView('studentResult'); }} />;
                    case 'studentResult':
                        return <StudentResult result={currentExamSession} settings={db.settings} onLogout={() => { setCurrentUser(null); setCurrentExamSession(null); setCurrentView('studentLogin'); }} onPrint={() => { setPrintData(currentExamSession); setPrintMode('student-result'); }} />;
                    case 'adminLogin':
                        return <AdminLogin onLogin={() => { setCurrentUser('admin'); setCurrentView('adminDash'); }} onBack={() => setCurrentView('studentLogin')} />;
                    case 'adminDash':
                        return <AdminDashboard db={db} setDb={setDb} onLogout={() => { setCurrentUser(null); setCurrentView('studentLogin'); }} onPrint={(mode, data) => { setPrintData(data); setPrintMode(mode); }} />;
                    default:
                        return <div>Halaman tidak ditemukan</div>;
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {!printMode && (
                        <nav className="bg-blue-800 text-white shadow-md p-4 flex justify-between items-center no-print">
                            <div className="flex items-center gap-3">
                                <div className="bg-white p-1 rounded-xl shadow-sm flex items-center justify-center">
                                    <EspenturaLogo className="w-8 h-10" />
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight tracking-wide">CBT KKA SMP</h1>
                                    <p className="text-xs text-blue-200 font-medium">SMP Negeri 1 Jepara (ESPENTURA)</p>
                                </div>
                            </div>
                            {currentUser && (
                                <div className="flex items-center gap-3 text-sm">
                                    <span className="hidden md:inline"><i className="ph-bold ph-user-circle mr-1"></i> {currentUser === 'admin' ? 'Administrator' : currentUser.name}</span>
                                    {currentView !== 'exam' && (
                                        <button onClick={() => { setCurrentUser(null); setCurrentView('studentLogin'); }} className="bg-blue-700 hover:bg-blue-600 px-3 py-1 rounded text-white transition">Logout</button>
                                    )}
                                </div>
                            )}
                        </nav>
                    )}

                    <main className={`flex-grow w-full mx-auto ${printMode ? 'print-container' : 'max-w-7xl'}`}>
                        {renderView()}
                    </main>

                    {!printMode && (
                        <footer className="bg-gray-800 text-gray-400 text-center py-4 text-sm mt-auto no-print">
                            &copy; 2026 CBT KKA SMP - ESPENTURA. Dikembangkan untuk Asesmen Pendidikan SMP Negeri 1 Jepara.
                        </footer>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
